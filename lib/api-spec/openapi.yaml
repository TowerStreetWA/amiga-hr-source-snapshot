      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        jobId: { type: ["integer", "null"] }
        jobTitle: { type: ["string", "null"] }
        currentStage:
          type: string
          enum: [new, cv_review, shortlisted, phone_screen, interview_1, interview_2, interview_3, assessment, offer_pending, offered, hired, rejected]
        source:
          type: string
