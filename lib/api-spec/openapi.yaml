openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Amiga Specialty HR Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: employees
    description: Employee records
  - name: salary
    description: Salary history
  - name: documents
    description: Employee documents
  - name: dashboard
    description: Dashboard stats and activity
  - name: storage
    description: Object storage
  - name: jobs
    description: Job postings
  - name: candidates
    description: Recruitment candidates
  - name: interviews
    description: Candidate interviews
  - name: offers
    description: Candidate offers
  - name: recruitment
    description: Recruitment workflow
  - name: public
    description: Public unauthenticated endpoints
  - name: onboarding
    description: Employee onboarding tasks
  - name: training
    description: Employee training records
  - name: leave
    description: Employee leave management
  - name: sickness
    description: Sickness absence tracking
  - name: pay
    description: Pay & compensation analytics and bulk reviews
  - name: benefits
    description: Benefits catalogue and assignments
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getCurrentUser
      tags: [me]
      summary: Current authenticated user (role + linked employee)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }

  /admin/users:
    get:
      operationId: listAppUsers
      tags: [admin]
      summary: List app users with roles (admin only)
      responses:
        "200":
          description: App users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AppUser" }

  /admin/users/{id}:
    patch:
      operationId: updateAppUser
      tags: [admin]
      summary: Update an app user's role / linked employee (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAppUserBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppUser" }

  /admin/maintenance/public-uploads/health:
    get:
      operationId: getPublicUploadCleanupHealth
      tags: [admin]
      summary: Get aggregate public upload cleanup health (admin only)
      responses:
        "200":
          description: Tenant cleanup health
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicUploadCleanupHealth" }

  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [active, on_leave, terminated]
        - name: department
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Employees
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Employee" }
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create employee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEmployeeBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
    patch:
      operationId: updateEmployee
      tags: [employees]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEmployeeBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
    delete:
      operationId: deleteEmployee
      tags: [employees]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /employees/{id}/salary-history:
    get:
      operationId: listSalaryHistory
      tags: [salary]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Salary history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SalaryChange" }
    post:
      operationId: createSalaryChange
      tags: [salary]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSalaryChangeBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalaryChange" }

  /employees/{id}/documents:
    get:
      operationId: listEmployeeDocuments
      tags: [documents]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EmployeeDocument" }
    post:
      operationId: createEmployeeDocument
      tags: [documents]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDocumentBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeDocument" }

  /documents/{docId}:
    delete:
      operationId: deleteEmployeeDocument
      tags: [documents]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardStats" }

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEntry" }

  /dashboard/department-breakdown:
    get:
      operationId: getDepartmentBreakdown
      tags: [dashboard]
      responses:
        "200":
          description: Department breakdown
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DepartmentCount" }

  /dashboard/upcoming-anniversaries:
    get:
      operationId: getUpcomingAnniversaries
      tags: [dashboard]
      responses:
        "200":
          description: Upcoming anniversaries (next 60 days)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AnniversaryEntry" }

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestUploadUrlBody" }
      responses:
        "200":
          description: Upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestUploadUrlResponse" }

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [open, closed, draft] }
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
    post:
      operationId: createJob
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateJobBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }

  /jobs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: getJob
      tags: [jobs]
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
    patch:
      operationId: updateJob
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateJobBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
    delete:
      operationId: deleteJob
      tags: [jobs]
      responses:
        "204": { description: Deleted }

  /candidates:
    get:
      operationId: listCandidates
      tags: [candidates]
      parameters:
        - in: query
          name: stage
          schema: { type: string }
        - in: query
          name: jobId
          schema: { type: integer }
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Candidate" }
    post:
      operationId: createCandidate
      tags: [candidates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCandidateBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidate" }

  /candidates/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: getCandidate
      tags: [candidates]
      responses:
        "200":
          description: Candidate detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateDetail" }
    patch:
      operationId: updateCandidate
      tags: [candidates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCandidateBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidate" }
    delete:
      operationId: deleteCandidate
      tags: [candidates]
      responses:
        "204": { description: Deleted }

  /candidates/{id}/stage:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: changeCandidateStage
      tags: [candidates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeStageBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Candidate" }

  /candidates/{id}/documents:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: listCandidateDocuments
      tags: [candidates]
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CandidateDocument" }
    post:
      operationId: createCandidateDocument
      tags: [candidates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCandidateDocumentBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateDocument" }

  /candidate-documents/{docId}:
    parameters:
      - in: path
        name: docId
        required: true
        schema: { type: integer }
    delete:
      operationId: deleteCandidateDocument
      tags: [candidates]
      responses:
        "204": { description: Deleted }

  /candidates/{id}/interviews:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: listInterviews
      tags: [interviews]
      responses:
        "200":
          description: Interviews
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Interview" }
    post:
      operationId: createInterview
      tags: [interviews]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInterviewBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interview" }

  /interviews/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      operationId: updateInterview
      tags: [interviews]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInterviewBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interview" }
    delete:
      operationId: deleteInterview
      tags: [interviews]
      responses:
        "204": { description: Deleted }

  /candidates/{id}/offers:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: listOffers
      tags: [offers]
      responses:
        "200":
          description: Offers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Offer" }
    post:
      operationId: createOffer
      tags: [offers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOfferBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }

  /offers/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      operationId: updateOffer
      tags: [offers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOfferBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
    delete:
      operationId: deleteOffer
      tags: [offers]
      responses:
        "204": { description: Deleted }

  /candidates/{id}/convert-to-employee:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      operationId: convertCandidateToEmployee
      tags: [recruitment]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConvertCandidateBody" }
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }

  /recruitment/stats:
    get:
      operationId: getRecruitmentStats
      tags: [recruitment]
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecruitmentStats" }

  /public/jobs:
    get:
      operationId: listPublicJobs
      tags: [public]
      responses:
        "200":
          description: Open jobs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
        "503":
          description: Open roles are temporarily unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicJobsUnavailableResponse" }

  /public/applications:
    post:
      operationId: submitApplication
      tags: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicApplicationBody" }
      responses:
        "200":
          description: Existing application returned for an idempotent retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicApplicationResponse" }
        "201":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicApplicationResponse" }

  /public/storage/uploads/request-url:
    post:
      operationId: requestPublicUploadUrl
      tags: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestUploadUrlBody" }
      responses:
        "200":
          description: Upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestUploadUrlResponse" }

  /onboarding/overview:
    get:
      operationId: getOnboardingOverview
      tags: [onboarding]
      summary: Per-employee onboarding overview
      responses:
        "200":
          description: Overview rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OnboardingEmployeeOverview" }

  /onboarding/employees/{id}/tasks:
    get:
      operationId: listOnboardingTasks
      tags: [onboarding]
      summary: List onboarding tasks for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OnboardingTask" }
    post:
      operationId: createOnboardingTask
      tags: [onboarding]
      summary: Add onboarding task to employee
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOnboardingTaskBody" }
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingTask" }

  /onboarding-tasks/{taskId}:
    patch:
      operationId: updateOnboardingTask
      tags: [onboarding]
      summary: Update onboarding task
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOnboardingTaskBody" }
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingTask" }
    delete:
      operationId: deleteOnboardingTask
      tags: [onboarding]
      summary: Delete onboarding task
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /training:
    get:
      operationId: listAllTrainingRecords
      tags: [training]
      summary: List training records across all employees
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_progress, completed, expired, overdue, expiring_soon, all]
        - name: category
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Records with employee info
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrainingRecordWithEmployee" }

  /training/stats:
    get:
      operationId: getTrainingStats
      tags: [training]
      summary: Training & onboarding alert counters
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingTrainingStats" }

  /training/employees/{id}:
    get:
      operationId: listEmployeeTrainingRecords
      tags: [training]
      summary: List training records for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrainingRecord" }
    post:
      operationId: createTrainingRecord
      tags: [training]
      summary: Add training record to employee
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTrainingRecordBody" }
      responses:
        "201":
          description: Record created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingRecord" }

  /training-records/{recordId}:
    patch:
      operationId: updateTrainingRecord
      tags: [training]
      summary: Update training record
      parameters:
        - name: recordId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTrainingRecordBody" }
      responses:
        "200":
          description: Updated record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingRecord" }
    delete:
      operationId: deleteTrainingRecord
      tags: [training]
      summary: Delete training record
      parameters:
        - name: recordId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /leave:
    get:
      operationId: listLeaveRequests
      tags: [leave]
      summary: List all leave requests
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: leaveType
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LeaveRequestWithEmployee" }

  /leave/calendar:
    get:
      operationId: getLeaveCalendar
      tags: [leave]
      summary: Approved leave entries within window
      parameters:
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Calendar entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LeaveCalendarEntry" }

  /leave/stats:
    get:
      operationId: getLeaveStats
      tags: [leave]
      summary: Leave & sickness alert counters
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaveStats" }

  /leave/employees/{id}/entitlements:
    get:
      operationId: listEmployeeLeaveEntitlements
      tags: [leave]
      summary: List leave entitlements for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: year
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Entitlements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LeaveEntitlement" }

  /leave/employees/{id}/entitlements/{leaveType}:
    put:
      operationId: upsertEmployeeLeaveEntitlement
      tags: [leave]
      summary: Upsert a leave entitlement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: leaveType
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertLeaveEntitlementBody" }
