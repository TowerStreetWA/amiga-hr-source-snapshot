        salaryMin: { type: ["number", "null"] }
        salaryMax: { type: ["number", "null"] }
        currency: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        status:
          type: string
          enum: [open, closed, draft]
        closingDate: { type: ["string", "null"] }
        hiringManagerId: { type: ["integer", "null"] }
      required: [title, department, employmentType]

    UpdateJobBody:
      type: object
      properties:
        title: { type: string }
        department: { type: string }
        location: { type: string }
        employmentType:
          type: string
          enum: [full_time, part_time, contractor]
        salaryMin: { type: ["number", "null"] }
        salaryMax: { type: ["number", "null"] }
        currency: { type: string }
        description: { type: ["string", "null"] }
        status:
          type: string
          enum: [open, closed, draft]
        closingDate: { type: ["string", "null"] }
        hiringManagerId: { type: ["integer", "null"] }

