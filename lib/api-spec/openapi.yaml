      type: object
      properties:
        totalEmployees: { type: integer }
        activeEmployees: { type: integer }
        onLeaveEmployees: { type: integer }
        newHiresThisMonth: { type: integer }
        departmentsCount: { type: integer }
        averageTenureYears: { type: number }
        totalDocuments: { type: integer }
        totalPayrollMonthly: { type: number }
      required:
        [
          totalEmployees,
          activeEmployees,
          onLeaveEmployees,
          newHiresThisMonth,
          departmentsCount,
          averageTenureYears,
          totalDocuments,
          totalPayrollMonthly,
        ]

    DepartmentCount:
      type: object
      properties:
        department: { type: string }
        count: { type: integer }
