components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    Employee:
      type: object
      properties:
        id: { type: integer }
        employeeNumber: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        jobTitle: { type: string }
        department: { type: string }
        status:
          type: string
          enum: [active, on_leave, terminated]
        employmentType:
          type: string
          enum: [full_time, part_time, contractor]
        managerId: { type: ["integer", "null"] }
        startDate: { type: string }
        endDate: { type: ["string", "null"] }
        salary: { type: ["number", "null"] }
        currency: { type: string }
        dateOfBirth: { type: ["string", "null"] }
        addressLine1: { type: ["string", "null"] }
        addressLine2: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        postcode: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        emergencyName: { type: ["string", "null"] }
        emergencyRelationship: { type: ["string", "null"] }
        emergencyPhone: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
      required:
        [
          id,
          employeeNumber,
          firstName,
          lastName,
          email,
          jobTitle,
          department,
          status,
          employmentType,
          startDate,
          currency,
          createdAt,
          updatedAt,
        ]

    CreateEmployeeBody:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        jobTitle: { type: string }
        department: { type: string }
        status:
          type: string
          enum: [active, on_leave, terminated]
        employmentType:
          type: string
          enum: [full_time, part_time, contractor]
        managerId: { type: ["integer", "null"] }
        startDate: { type: string }
        endDate: { type: ["string", "null"] }
        salary: { type: ["number", "null"] }
        currency: { type: ["string", "null"] }
        dateOfBirth: { type: ["string", "null"] }
        addressLine1: { type: ["string", "null"] }
        addressLine2: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        postcode: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        emergencyName: { type: ["string", "null"] }
        emergencyRelationship: { type: ["string", "null"] }
        emergencyPhone: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
      required:
        [firstName, lastName, email, jobTitle, department, employmentType, startDate]

    UpdateEmployeeBody:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        jobTitle: { type: string }
        department: { type: string }
        status:
          type: string
          enum: [active, on_leave, terminated]
        employmentType:
          type: string
          enum: [full_time, part_time, contractor]
        managerId: { type: ["integer", "null"] }
        startDate: { type: string }
        endDate: { type: ["string", "null"] }
        salary: { type: ["number", "null"] }
        currency: { type: ["string", "null"] }
        dateOfBirth: { type: ["string", "null"] }
        addressLine1: { type: ["string", "null"] }
        addressLine2: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        postcode: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        emergencyName: { type: ["string", "null"] }
        emergencyRelationship: { type: ["string", "null"] }
        emergencyPhone: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }

    CurrentUserEmployee:
      type: object
      properties:
        id: { type: integer }
        employeeNumber: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        jobTitle: { type: string }
        department: { type: string }
      required:
        [id, employeeNumber, firstName, lastName, jobTitle, department]

    CurrentUser:
      type: object
      properties:
        clerkUserId: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [admin, manager, employee]
        employeeId: { type: ["integer", "null"] }
        linked: { type: boolean }
        employee:
          oneOf:
            - $ref: "#/components/schemas/CurrentUserEmployee"
            - type: "null"
      required: [clerkUserId, email, role, employeeId, linked, employee]

    AppUser:
      type: object
      properties:
        id: { type: integer }
        clerkUserId: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [admin, manager, employee]
        employeeId: { type: ["integer", "null"] }
        employeeName: { type: ["string", "null"] }
        employeeNumber: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, clerkUserId, email, role, employeeId, createdAt, updatedAt]

