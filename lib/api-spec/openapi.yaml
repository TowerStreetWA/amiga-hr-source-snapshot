      type: object
      properties:
        tenantId: { type: string, format: uuid }
        status:
          type: string
          enum: [active, recovered]
        failureCount: { type: integer, minimum: 0 }
        failedUploadCount: { type: integer, minimum: 0 }
        lastFailureAt: { type: string, format: date-time }
        recoveredAt: { type: ["string", "null"], format: date-time }
      required:
        [
          tenantId,
          status,
          failureCount,
          failedUploadCount,
          lastFailureAt,
          recoveredAt,
        ]

    UpdateAppUserBody:
      type: object
      properties:
        role:
          type: string
          enum: [admin, manager, employee]
        employeeId: { type: ["integer", "null"] }

    SalaryChange:
      type: object
      properties:
        id: { type: integer }
        employeeId: { type: integer }
        previousSalary: { type: ["number", "null"] }
        newSalary: { type: number }
        percentChange: { type: ["number", "null"] }
        effectiveDate: { type: string }
        reason: { type: ["string", "null"] }
        createdAt: { type: string }
      required: [id, employeeId, newSalary, effectiveDate, createdAt]

    CreateSalaryChangeBody:
      type: object
