        employeeId: { type: integer }
        employeeNumber: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        jobTitle: { type: string }
        department: { type: string }
        startDate: { type: string }
        yearsOfService: { type: integer }
        anniversaryDate: { type: string }
      required:
        [
          employeeId,
          employeeNumber,
          firstName,
          lastName,
          jobTitle,
          department,
          startDate,
          yearsOfService,
          anniversaryDate,
        ]

    ActivityEntry:
      type: object
      properties:
        id: { type: integer }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: ["integer", "null"] }
        summary: { type: string }
        actor: { type: ["string", "null"] }
        createdAt: { type: string }
      required: [id, action, entityType, summary, createdAt]

